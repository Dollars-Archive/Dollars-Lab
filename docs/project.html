<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#eef7f6" />
  <meta name="description" content="Dollars Lab 프로젝트 문서" />
  <title>Dollars Lab · Project</title>
  <link rel="stylesheet" href="assets/style.css" />

<body data-page="reader">
  <header class="topbar">

      <a class="brand" href="./">← Dollars Lab</a>
