<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#eef7f6" />
  <meta name="description" content="Dollars Lab 개인 프로그램·유틸리티 아카이브" />
  <title>Dollars Lab</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="index">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">Dollars Lab</a>
      <a class="top-link" href="https://github.com/Dollars-Archive/Dollars-Lab" target="_blank" rel="noreferrer">GitHub ↗</a>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <p class="eyebrow">DOLLARS · PERSONAL SOFTWARE LAB</p>
      <h1>필요해서 만들고,<br>재밌어서 남기는 것들.</h1>
      <p class="hero-copy">Android APK, Windows 유틸리티, 게임 관련 도구, 자동화 스크립트까지. 취미로 만든 작은 프로그램을 한곳에 모아둡니다.</p>
      <div class="hero-badges">
        <span>Android</span><span>Windows</span><span>Game Tools</span><span>Scripts</span>
      </div>
    </section>

    <section class="panel">
      <div class="section-head">
        <div>
          <p class="eyebrow">PROJECTS</p>
          <h2>프로젝트</h2>
        </div>
        <p class="section-copy">README의 프로젝트 목록을 자동으로 읽어옵니다.</p>
      </div>
      <div id="status" class="status">프로젝트 목록을 불러오는 중…</div>
      <div id="project-grid" class="project-grid" hidden></div>
    </section>
  </main>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
