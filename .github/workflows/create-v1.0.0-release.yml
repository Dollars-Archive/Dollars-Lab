name: Create v1.0.0 Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Create v1.0.0 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "Odin2 Portal HOME 버튼 스크린샷 도우미 v1.0.0" \
            --notes-file RELEASE_v1.0.0.md
