name: One-shot fix Odin release image URLs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot fix Odin release image URLs'
    runs-on: ubuntu-latest
    steps:
      - name: Replace stale release image URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/releases/379543356 > release.json
          python - <<'PY'
          import json
          data = json.load(open('release.json', encoding='utf-8'))
          body = data['body']
          old = 'https://raw.githubusercontent.com/DollarsArchive/odin2-portal-home-screenshot/main/assets/release/'
          new = 'https://raw.githubusercontent.com/Dollars-Archive/Dollars-Lab/main/projects/odin2-portal-home-screenshot/assets/release/'
          count = body.count(old)
          assert count == 4, f'expected 4 stale image URLs, found {count}'
          body = body.replace(old, new)
          json.dump({'body': body}, open('payload.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/379543356 --input payload.json > updated.json
          gh api repos/${GITHUB_REPOSITORY}/releases/379543356 > verify.json
          python - <<'PY'
          import json
          data = json.load(open('verify.json', encoding='utf-8'))
          body = data['body']
          old = 'https://raw.githubusercontent.com/DollarsArchive/odin2-portal-home-screenshot/main/assets/release/'
          new = 'https://raw.githubusercontent.com/Dollars-Archive/Dollars-Lab/main/projects/odin2-portal-home-screenshot/assets/release/'
          assert old not in body
          for i in range(1, 5):
              url = f'{new}{i:02d}.webp'
              assert url in body, f'missing {url}'
          print('release image URLs updated')
          PY
