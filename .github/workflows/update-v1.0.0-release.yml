name: Update v1.0.0 Release

on:
  push:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release.md <<'EOF'
          # Odin2 Portal HOME 버튼 스크린샷 도우미 v1.0.0

          Odin2 Portal의 **HOME 버튼을 스크린샷 버튼으로 사용할 수 있게 해주는 Android APK**입니다.

          ## 설치 및 설정 방법

          ### 1. APK 설치 후 앱 실행

          APK를 설치한 뒤 앱을 실행합니다.

          **접근성 설정 열기**를 눌러 접근성 설정으로 이동합니다.

          <p align="center">
            <img src="https://raw.githubusercontent.com/DollarsArchive/odin2-portal-home-screenshot/main/assets/release/01.webp" width="75%">
          </p>

          ### 2. Odin HOME 캡처 서비스 선택

          접근성 설정에서 **Odin HOME 캡처 서비스**를 선택합니다.

          <p align="center">
            <img src="https://raw.githubusercontent.com/DollarsArchive/odin2-portal-home-screenshot/main/assets/release/02.webp" width="75%">
          </p>

          ### 3. 접근성 서비스 사용

          **Odin HOME 캡처 서비스 사용**을 켭니다.

          접근성 권한은 최초 1회만 직접 승인하면 됩니다.

          <p align="center">
            <img src="https://raw.githubusercontent.com/DollarsArchive/odin2-portal-home-screenshot/main/assets/release/03.webp" width="75%">
          </p>

          ### 4. Odin2 Portal HOME 버튼 오입력 방지 끄기

          Odin2 Portal 설정으로 이동한 뒤
          **「실수로 홈 버튼을 누르는 것을 방지」 기능을 끕니다.**

          <p align="center">
            <img src="https://raw.githubusercontent.com/DollarsArchive/odin2-portal-home-screenshot/main/assets/release/04.webp" width="75%">
          </p>

          설정이 완료되면 HOME 버튼을 이용해 스크린샷을 촬영할 수 있으며,
          **기기를 재부팅해도 설정이 유지됩니다.**

          원래 HOME 버튼 기능으로 되돌리려면 앱에서 **「HOME 버튼을 스크린샷으로 사용」 체크를 해제**하면 됩니다.  
          체크를 해제하면 HOME 버튼이 정상적인 HOME 버튼으로 동작합니다.

          > Android 보안 정책상 일반 APK가 접근성 서비스를 자동으로 승인하는 것은 불가능하므로, 최초 1회는 반드시 사용자가 직접 활성화해야 합니다.

          ## 주의사항

          - **Odin2 Portal 최신 펌웨어 기준으로 제작 및 테스트했습니다.**
          - **Odin2 Portal 이외의 Odin 시리즈에서는 테스트하지 않았습니다.**
          - 다른 Odin 기종에는 설치를 권장하지 않습니다.
          - 다른 기종 또는 확인되지 않은 펌웨어에서 사용하여 발생하는 오작동, 설정 문제, 부팅 이상 등의 문제에 대해서는 책임지지 않습니다.
          - 사용 전 본인의 기기와 펌웨어 환경을 확인한 뒤 사용해 주세요.
          EOF
          gh release edit v1.0.0 --repo DollarsArchive/odin2-portal-home-screenshot --title "Odin2 Portal HOME 버튼 스크린샷 도우미 v1.0.0" --notes-file /tmp/release.md
