name: Update v1.0.0 Release

on:
  push:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo DollarsArchive/odin2-portal-home-screenshot --json body --jq .body > /tmp/release.md
          sed -i 's/width="75%"/width="45%"/g' /tmp/release.md
          gh release edit v1.0.0 --repo DollarsArchive/odin2-portal-home-screenshot --notes-file /tmp/release.md
